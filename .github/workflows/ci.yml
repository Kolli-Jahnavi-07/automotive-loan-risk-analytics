name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Unit tests
        run: make test

      - name: End-to-end pipeline on a small portfolio
        run: make data silver dbt LOANS=3000

      - name: Check the Airflow DAG compiles
        run: python -m py_compile orchestration/dags/loan_risk_daily.py
